<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TM Building Modeler</title>
    <link rel="stylesheet" href="building-modeler.css">
</head>
<body>
    <!-- Main application shell: three columns, with the 3D viewport in the center. -->
    <div class="app">
        <!-- Left sidebar: generated list of placed building parts. -->
        <aside class="sidebar sidebar-left">
            <div class="brand">
                <div class="brand-title">Building Modeler</div>
                <div class="brand-subtitle">Terradrive parts</div>
            </div>
            <div class="panel-title">Elemente</div>
            <div id="elementList" class="element-list"></div>
        </aside>

        <!-- Center workspace: tool buttons, Three.js canvas target, and generated export code. -->
        <main class="workspace">
            <div class="toolbar">
                <button id="moveTool" class="tool-button" type="button">Move</button>
                <button id="duplicateElement" class="tool-button" type="button">Duplicate</button>
                <button id="deleteElement" class="tool-button danger" type="button">Delete</button>
                <button id="fillTool" class="tool-button" type="button">Fuellen</button>
                <button id="cutTool" class="tool-button" type="button">Ausschneiden</button>
                <button id="copyCode" class="tool-button primary" type="button">Konvertieren</button>
                <span id="statusText" class="status">Bereit</span>
            </div>
            <div id="viewport" class="viewport">
                <!-- Static hint overlays stay inside the viewport so they move with this panel visually. -->
                <div class="viewport-hint">Shift = Drag-Snap, V = Kanten-Modus</div>
                <div class="mirror-panel">
                    <label for="mirrorMode">Spiegelmodus</label>
                    <select id="mirrorMode">
                        <option value="off">Aus</option>
                        <option value="quad">Alle 4 Quadranten</option>
                        <option value="x">X gespiegelt</option>
                        <option value="z">Z gespiegelt</option>
                        <option value="diagA">Diagonal A</option>
                        <option value="diagB">Diagonal B</option>
                    </select>
                </div>
            </div>
            <textarea id="codeOutput" class="code-output" spellcheck="false" readonly></textarea>
        </main>

        <!-- Right sidebar: palette, inspector, and export/settings forms are rendered by building-modeler.js. -->
        <aside class="sidebar sidebar-right">
            <div class="tab-bar">
                <button type="button" class="tab-button active" data-tab="palette">Bauteile</button>
                <button type="button" class="tab-button" data-tab="inspector">Inspector</button>
                <button type="button" class="tab-button" data-tab="settings">Einstellungen</button>
            </div>
            <section id="tab-palette" class="tab-panel active">
                <div id="palette" class="palette"></div>
            </section>
            <section id="tab-inspector" class="tab-panel">
                <form id="inspector" class="inspector"></form>
            </section>
            <section id="tab-settings" class="tab-panel">
                <form id="settingsPanel" class="settings-panel"></form>
            </section>
        </aside>
    </div>

    <!-- Import map keeps browser module imports short and aligned with the Three.js CDN version. -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <!-- Main editor logic: diagnostics, scene setup, tools, export generation. -->
    <script type="module" src="building-modeler.js"></script>
</body>
</html>
